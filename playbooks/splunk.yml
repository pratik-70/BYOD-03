---
- name: Install and Configure Splunk
  hosts: webservers
  become: yes
  gather_facts: no
  vars:
    splunk_version: "9.0.5"
    splunk_user: "splunk"
    splunk_group: "splunk"
    splunk_home: "/opt/splunk"
    splunk_admin_password: "SplunkAdmin123!"

  tasks:
    - name: Update system packages
      raw: yum update -y
      register: yum_update
      retries: 3
      delay: 10

    - name: Install required dependencies
      raw: yum install -y wget curl openssl libffi-devel openssl-devel python3 python3-pip
      register: install_deps

    - name: Create splunk group
      raw: groupadd splunk || true

    - name: Create splunk user
      raw: useradd -g splunk -m -s /bin/bash splunk || true

    - name: Download Splunk Enterprise RPM
      get_url:
        url: https://download.splunk.com/products/splunk/releases/9.0.5/linux/splunk-9.0.5-e9494146ae5c-linux-2.6-x86_64.rpm
        dest: /tmp/splunk.rpm

    - name: Install Splunk RPM
      raw: rpm -ivh "/tmp/splunk-9.0.5-e9494146ae5c-linux-2.6-x86_64.rpm"

    - name: Set ownership on Splunk directory
      raw: chown -R splunk:splunk /opt/splunk

    - name: Create Splunk configuration directories
      raw: |
        mkdir -p /opt/splunk/etc/system/local
        mkdir -p /opt/splunk/var
        chown -R splunk:splunk /opt/splunk/etc /opt/splunk/var
        chmod -R 755 /opt/splunk/etc /opt/splunk/var

    - name: Start Splunk on first run
      raw: |
        su - splunk -c "/opt/splunk/bin/splunk start --accept-license --answer-yes --seed-passwd 'SplunkAdmin123!' || true"
      register: splunk_start
      retries: 3
      delay: 30

    - name: Enable Splunk at boot
      raw: su - splunk -c "/opt/splunk/bin/splunk enable boot-start -auth admin:SplunkAdmin123!"
      register: splunk_boot
      ignore_errors: yes

    - name: Wait for Splunk to fully start
      raw: sleep 15; timeout 300 bash -c 'until nc -z localhost 8089; do sleep 5; done'
      ignore_errors: yes

    - name: Clean up temporary files
      raw: rm -f "/tmp/splunk-9.1.2-b6b9c8185839-linux-2.6-x86_64.rpm"

    - name: Display Splunk installation status
      raw: echo "Splunk 9.1.2 installation completed"
